name: Update apartments Moscow dashboard

on:
  workflow_dispatch:
    inputs:
      scrape:
        description: "Собрать свежие данные (нужен доступ к restate.ru, с раннера GitHub будет 403)"
        type: boolean
        default: false
      max_listings:
        description: "Сколько detail-страниц разобрать при сборе"
        type: string
        default: "130"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apartments-moscow-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/apartments-moscow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            projects/apartments-moscow/requirements.txt
            projects/apartments-moscow/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run parser tests
        run: python -m pytest tests -q

      - name: Skip scraping on scheduled runs
        if: ${{ !inputs.scrape }}
        run: |
          echo "Restate blocks datacenter IPs (HTTP 403 from GitHub runners)."
          echo "Scheduled runs only rebuild the dashboard from data/sample.json."
          echo "To refresh the data manually, run the scraper locally and push the result."

      - name: Collect listing IDs
        if: ${{ inputs.scrape }}
        run: python scraper/collect_ids.py --max-pages 2 --delay 2

      - name: Parse listing details
        if: ${{ inputs.scrape }}
        run: python scraper/parse_detail.py --max-listings "${{ inputs.max_listings || 130 }}" --delay 2

      - name: Report data freshness
        id: freshness
        run: |
          python src/freshness.py --github-output "$GITHUB_OUTPUT" --max-age-days 7

      - name: Build dashboard
        run: python src/build_dashboard.py

      - name: Commit anonymized outputs
        run: |
          ROWS=$(python -c 'import json; print(len(json.load(open("data/sample.json"))))')
          git add data/sample.json dashboard.html
          if git diff --cached --quiet; then
            echo "No dashboard changes"
          else
            printf 'data: update apartments Moscow dashboard\n\ndata_as_of: %s\nrows: %s\nrebuilt: scheduled dashboard refresh from committed sample.json\n' \
              "${{ steps.freshness.outputs.data_as_of || 'unknown' }}" "$ROWS" \
              | git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -F -
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.pages/projects/apartments-moscow"
          cp dashboard.html "$GITHUB_WORKSPACE/.pages/projects/apartments-moscow/dashboard.html"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/.pages

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
